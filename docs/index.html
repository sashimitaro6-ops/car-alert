<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>マツダ中古車ウォッチ</title>
<style>
:root{
  --bg:#f5f5f7; --surface:#ffffff; --surface-2:#fbfbfd; --text:#1d1d1f; --text-2:#6e6e73; --text-3:#86868b;
  --hair:rgba(0,0,0,.08); --fill:rgba(0,0,0,.05); --fill-2:rgba(0,0,0,.08);
  --link:#0066cc; --accent:#0071e3; --accent-h:#0077ed;
  --main:#248a3d; --main-bg:rgba(36,138,61,.12); --near:#b25000; --near-bg:rgba(201,94,0,.12);
  --drop:#d70015; --drop-bg:rgba(215,0,21,.10); --new:#0071e3; --new-bg:rgba(0,113,227,.12);
  --star:#ff9f0a; --ended:#86868b;
  --nav:rgba(251,251,253,.78); --shadow:0 2px 6px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --shadow-h:0 4px 10px rgba(0,0,0,.06),0 18px 44px rgba(0,0,0,.12);
  --memo:#fff8e1; --memo-line:#f1dfa4;
  --ease:cubic-bezier(.28,.11,.32,1);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000; --surface:#1c1c1e; --surface-2:#161617; --text:#f5f5f7; --text-2:#a1a1a6; --text-3:#86868b;
    --hair:rgba(255,255,255,.10); --fill:rgba(255,255,255,.08); --fill-2:rgba(255,255,255,.14);
    --link:#2997ff; --accent:#0a84ff; --accent-h:#409cff;
    --main:#30d158; --main-bg:rgba(48,209,88,.16); --near:#ff9f0a; --near-bg:rgba(255,159,10,.16);
    --drop:#ff453a; --drop-bg:rgba(255,69,58,.16); --new:#64d2ff; --new-bg:rgba(100,210,255,.14);
    --nav:rgba(22,22,23,.72); --shadow:0 1px 0 rgba(255,255,255,.04) inset; --shadow-h:0 0 0 1px rgba(255,255,255,.12) inset,0 18px 44px rgba(0,0,0,.5);
    --memo:rgba(255,214,10,.10); --memo-line:rgba(255,214,10,.28);
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Segoe UI",sans-serif;
  font-size:15px;line-height:1.47;letter-spacing:-.01em;font-feature-settings:"palt";-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1180px;margin:0 auto;padding:0 32px}
.icon{width:18px;height:18px;display:block}

/* ---------- global nav ---------- */
.gnav{height:48px;background:var(--nav);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--hair)}
.gnav .wrap{height:100%;display:flex;align-items:center;gap:20px}
.brand{font-weight:600;font-size:15px;letter-spacing:-.01em;color:var(--text)}
.gnav .sp{flex:1}
.gnav a.ext{font-size:13px;color:var(--text-2)}
.gnav a.ext:hover{color:var(--text);text-decoration:none}
.iconbtn{width:34px;height:34px;border-radius:50%;border:none;background:none;display:grid;place-items:center;color:var(--text-2);transition:background .2s,color .2s}
.iconbtn:hover{background:var(--fill);color:var(--text)}

/* ---------- hero ---------- */
.hero{text-align:center;padding:40px 0 32px}
.eyebrow{font-size:17px;font-weight:600;color:var(--near);margin:0 0 10px;letter-spacing:.01em}
.hero h1{font-size:52px;line-height:1.06;font-weight:700;letter-spacing:-.025em;margin:0}
.hero .lead{font-size:19px;line-height:1.5;color:var(--text-2);margin:14px auto 0;max-width:860px;font-weight:400;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin:0 auto;max-width:920px}
.stat{padding:4px 12px;border-left:1px solid var(--hair)}
.stat:first-child{border-left:none}
.stat .lbl{font-size:13px;color:var(--text-2);font-weight:500}
.stat .val{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.stat .val small{font-size:19px;font-weight:600;margin-left:2px;letter-spacing:0}
.stat.good .val{color:var(--main)} .stat.red .val{color:var(--drop)}
.market{margin:24px auto 0;display:flex;justify-content:center;gap:28px;flex-wrap:wrap;font-size:14px;color:var(--text-2)}
.market b{color:var(--text);font-weight:600}
.updated{margin-top:18px;font-size:12px;color:var(--text-3)}

/* ---------- sticky local nav ---------- */
.lnav{position:sticky;top:0;z-index:20;background:var(--nav);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid transparent;transition:border-color .3s var(--ease)}
.lnav.stuck{border-bottom-color:var(--hair)}
.lnav .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:16px;height:56px}
.lnav .ttl{justify-self:start;font-size:17px;font-weight:600;white-space:nowrap;opacity:0;transform:translateY(4px);transition:opacity .35s var(--ease),transform .35s var(--ease);pointer-events:none}
.lnav.stuck .ttl{opacity:1;transform:none}
.lnav .totop{justify-self:end;border:none;background:none;color:var(--link);font-size:13px;opacity:0;pointer-events:none;transition:opacity .35s var(--ease);white-space:nowrap}
.lnav.stuck .totop{opacity:1;pointer-events:auto}
.seg{position:relative;display:flex;flex-shrink:0;width:max-content;background:var(--fill);border-radius:999px;padding:3px}
.seg .ind{position:absolute;top:3px;bottom:3px;left:0;border-radius:999px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);
  transition:transform .45s var(--ease),width .45s var(--ease);will-change:transform}
.tab{position:relative;z-index:1;border:none;background:none;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:500;color:var(--text-2);white-space:nowrap;transition:color .3s}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);font-weight:600}
.tab .n{margin-left:5px;color:var(--text-3);font-weight:500;font-variant-numeric:tabular-nums}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.select{position:relative}
.select select{appearance:none;-webkit-appearance:none;border:none;background:var(--fill);border-radius:999px;padding:7px 30px 7px 14px;font-size:13px;cursor:pointer;transition:background .2s}
.select select:hover{background:var(--fill-2)}
.select::after{content:"";position:absolute;right:13px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--text-2);border-bottom:1.5px solid var(--text-2);transform:translateY(-70%) rotate(45deg);pointer-events:none}

/* ---------- section ---------- */
main{padding:44px 0 40px}
.sechead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px;flex-wrap:wrap}
.sechead .right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.sechead h2{font-size:40px;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:0}
.sechead p{margin:8px 0 0;color:var(--text-2);font-size:17px}
.sechead .count{font-size:14px;color:var(--text-3);white-space:nowrap}
.notice{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:14px 20px;margin-bottom:28px;font-size:14px;color:var(--text-2);box-shadow:var(--shadow)}
.notice button{margin-left:auto}
.notice .x{margin-left:4px;width:28px;height:28px;border-radius:50%;border:none;background:none;color:var(--text-3);font-size:18px;line-height:1}
.notice .x:hover{background:var(--fill);color:var(--text)}
.thumb{cursor:zoom-in}
.title a{cursor:pointer}
.spark{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-2)}
.spark svg{display:block;overflow:visible}
.foot .l{display:flex;gap:10px;flex-wrap:wrap}
.cmp{border:1px solid var(--hair);background:none;border-radius:999px;padding:2px 10px;font-size:12px;color:var(--text-2);white-space:nowrap;transition:all .2s}
.cmp:hover{border-color:var(--link);color:var(--link)}
.cmp.on{background:var(--link);border-color:var(--link);color:#fff}

/* detail sheet */
dialog.sheet{width:min(1060px,94vw);max-height:90vh;padding:0;overflow:auto;border-radius:28px}
.sheet .close{position:sticky;top:16px;float:right;margin:16px 16px 0 0;z-index:3;width:36px;height:36px;border-radius:50%;border:none;
  background:var(--fill-2);color:var(--text);font-size:20px;line-height:36px;backdrop-filter:blur(10px)}
.sheet .close:hover{background:var(--fill)}
.dgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:36px;padding:40px 40px 8px}
.gallery{position:sticky;top:24px;align-self:start}
.gallery .main{position:relative;aspect-ratio:4/3;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,var(--fill),var(--fill-2))}
.gallery .main img{width:100%;height:100%;object-fit:cover;display:block;animation:fade .45s var(--ease)}
.gallery .nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.8);
  backdrop-filter:blur(10px);font-size:20px;color:#1d1d1f;opacity:0;transition:opacity .3s}
.gallery .main:hover .nav{opacity:1}
.gallery .prev{left:12px} .gallery .next{right:12px}
.gallery .count{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:3px 10px;border-radius:999px;backdrop-filter:blur(8px)}
.gallery .cat{font-weight:600;color:var(--text);margin-right:6px}
.gallery .cap{min-height:2.9em;font-size:12px;color:var(--text-2);margin:10px 2px 0;line-height:1.5}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scroll-behavior:smooth;padding:3px;scrollbar-width:thin}
.thumbs button{flex:0 0 76px;aspect-ratio:4/3;border:none;padding:0;border-radius:10px;overflow:hidden;background:var(--fill);opacity:.55;outline:2px solid transparent;outline-offset:2px;transition:opacity .2s,outline-color .2s}
.thumbs button.on{opacity:1;outline-color:var(--link)}
.thumbs button:hover{opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.dinfo .badges{position:static;margin-bottom:12px}
.dinfo .badge{background:var(--fill)}
.dinfo h2{font-size:30px;line-height:1.2;font-weight:700;letter-spacing:-.02em;margin:4px 0 14px}
.dinfo .price .total{font-size:44px}
.dinfo .actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 6px}
.dinfo .actions .btn{display:inline-flex;align-items:center;gap:6px}
.dinfo .actions a.btn:hover{text-decoration:none}
.dtable{width:100%;border-collapse:collapse;margin-top:18px;font-size:14px}
.dtable th{text-align:left;font-weight:400;color:var(--text-2);padding:9px 12px 9px 0;width:34%;border-top:1px solid var(--hair);vertical-align:top}
.dtable td{padding:9px 0;border-top:1px solid var(--hair)}
.dsec{padding:24px 40px 0}
.dsec:last-child{padding-bottom:40px}
.dsec h3{font-size:21px;font-weight:700;letter-spacing:-.015em;margin:0 0 12px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--fill);color:var(--text-2);white-space:nowrap}
.tag.ok{background:var(--main-bg);color:var(--main);font-weight:600}
.eqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.eqgrid h4{margin:0 0 8px;font-size:13px;color:var(--text-2);font-weight:600}
.spec2{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0 28px}
.spec2 div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--hair);font-size:14px}
.spec2 span{color:var(--text-2)}
.dsec .txt{color:var(--text-2);font-size:14px;line-height:1.7;white-space:pre-wrap}
.chartbox{background:var(--surface-2);border:1px solid var(--hair);border-radius:18px;padding:18px 20px}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}

/* compare */
.tray{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140%);z-index:30;display:flex;align-items:center;gap:14px;padding:10px 12px 10px 18px;border-radius:999px;
  background:var(--nav);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:0 10px 40px rgba(0,0,0,.18);
  transition:transform .5s var(--ease)}
.tray.show{transform:translate(-50%,0)}
.tray .pics{display:flex}
.tray .pics span{width:34px;height:34px;border-radius:50%;overflow:hidden;border:2px solid var(--surface);margin-left:-8px;background:var(--fill-2)}
.tray .pics span:first-child{margin-left:0}
.tray .pics img{width:100%;height:100%;object-fit:cover}
.tray .lbl{font-size:14px;font-weight:600;white-space:nowrap}
dialog.cmpdlg{width:min(1180px,96vw);max-height:90vh;overflow:auto;padding:40px}
.ctable{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;table-layout:fixed}
.ctable th{text-align:left;font-weight:400;color:var(--text-2);width:120px;padding:10px 12px 10px 0;border-top:1px solid var(--hair);vertical-align:top}
.ctable td{padding:10px 14px;border-top:1px solid var(--hair);vertical-align:top}
.ctable tr.head td{border-top:none;padding-top:0}
.ctable .pic{aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:var(--fill);margin-bottom:10px;cursor:zoom-in}
.ctable .pic img{width:100%;height:100%;object-fit:cover;display:block}
.ctable .name{font-weight:600;line-height:1.35}
.ctable .name small{display:block;font-weight:500;color:var(--text-2);font-size:12px;margin-bottom:2px}
.ctable .best{color:var(--main);font-weight:700}
.ctable .best::after{content:"  ◎";font-size:11px}
.ctable .big{font-size:22px;font-weight:700;letter-spacing:-.02em}
.ctable tr.grp th{padding-top:26px;font-size:13px;font-weight:700;color:var(--text);border-top:none}
.ctable tr.grp td{border-top:none}
.ctable .yes{color:var(--main);font-weight:700}
.ctable .no{color:var(--text-3)}
.ctable .rm{border:none;background:none;color:var(--text-3);font-size:12px;padding:0;margin-top:8px}
.ctable .rm:hover{color:var(--drop)}
@media (max-width: 900px){ .dgrid{grid-template-columns:1fr;padding:28px 24px 0} .dsec{padding:20px 24px 0} }

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
.card{background:var(--surface);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:var(--shadow);
  transition:transform .5s var(--ease),box-shadow .5s var(--ease),opacity .6s var(--ease)}
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow-h)}
.card.pre{opacity:0;transform:translateY(28px)}
.card.ended{opacity:.55}
.card.ended:hover{opacity:.8}
.thumb{position:relative;aspect-ratio:4/3;background:linear-gradient(135deg,var(--fill),var(--fill-2));display:block;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s var(--ease)}
.card:hover .thumb img{transform:scale(1.045)}
.badges{position:absolute;left:14px;top:14px;display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;letter-spacing:.02em;
  background:rgba(255,255,255,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.b-main{color:var(--main)} .b-near{color:var(--near)} .b-new{color:var(--new)} .b-drop{color:var(--drop)} .b-ended{color:#3a3a3c} .b-oos{color:#3a3a3c}
@media (prefers-color-scheme: dark){ .badge{background:rgba(0,0,0,.55)} .b-ended,.b-oos{color:#d1d1d6} }
.starbtn{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;border:none;display:grid;place-items:center;
  background:rgba(255,255,255,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#6e6e73;
  transition:transform .35s var(--ease),background .2s,color .2s}
.starbtn:hover{transform:scale(1.08);background:rgba(255,255,255,.95)}
.starbtn.on{color:var(--star)}
.starbtn.pop{animation:pop .5s var(--ease)}
.starbtn:disabled{cursor:wait}
.starbtn:disabled svg{animation:pulse 1s ease-in-out infinite}
.starbtn svg{width:20px;height:20px}
@media (prefers-color-scheme: dark){ .starbtn{background:rgba(30,30,32,.7);color:#d1d1d6} .starbtn:hover{background:rgba(44,44,46,.9)} }
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes pulse{50%{opacity:.35}}
.body{padding:20px 22px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.cmodel{font-size:12px;font-weight:600;color:var(--text-2);letter-spacing:.02em}
.title{font-size:19px;line-height:1.3;font-weight:600;letter-spacing:-.015em;margin:-6px 0 0}
.title a{color:inherit}
.title a:hover{color:var(--link);text-decoration:none}
.price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.price .total{font-size:30px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.price .total small{font-size:15px;font-weight:600;letter-spacing:0;margin-left:1px}
.price .base{color:var(--text-3);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;width:fit-content}
.chip.drop{color:var(--drop);background:var(--drop-bg)}
.chip.reason{color:var(--near);background:var(--near-bg)}
.specs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:4px 0 0;padding:14px 0 0;border-top:1px solid var(--hair);row-gap:12px}
.specs div{min-width:0;padding-right:8px}
.specs dt{font-size:11px;color:var(--text-3);margin:0}
.specs dd{margin:2px 0 0;font-size:14px;font-weight:500;overflow-wrap:anywhere}
.meta{color:var(--text-2);font-size:13px;line-height:1.5}
.catch{color:var(--text-3);font-size:12px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
details{font-size:12px;color:var(--text-2)}
details summary{cursor:pointer;color:var(--link);list-style:none;width:fit-content}
details summary::-webkit-details-marker{display:none}
details summary::after{content:" ›";display:inline-block;transition:transform .3s var(--ease)}
details[open] summary::after{transform:rotate(90deg)}
details table{border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums}
details td{padding:2px 14px 2px 0}
.memo{background:var(--memo);border:1px solid var(--memo-line);border-radius:14px;padding:10px 12px;font-size:13px;white-space:pre-wrap;cursor:pointer;transition:filter .2s}
.memo:hover{filter:brightness(.98)}
.memo.emptymemo{background:none;border:1px dashed var(--hair);color:var(--text-3);text-align:center}
.memo.emptymemo:hover{color:var(--link);border-color:var(--link)}
.memo textarea{width:100%;min-height:76px;border:1px solid var(--hair);background:var(--surface);border-radius:10px;padding:8px 10px;resize:vertical;outline:none}
.memo textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,227,.2)}
.memo .mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.foot{display:flex;justify-content:space-between;gap:8px;color:var(--text-3);font-size:12px;margin-top:auto;padding-top:6px}
.old{color:var(--drop);font-weight:600}

/* ---------- buttons ---------- */
.btn{border:none;border-radius:999px;padding:8px 18px;font-size:14px;background:var(--fill);color:var(--text);transition:background .2s,transform .2s}
.btn:hover{background:var(--fill-2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-h)}
.btn.sm{padding:5px 14px;font-size:13px}

.empty{grid-column:1/-1;text-align:center;padding:96px 24px;color:var(--text-2)}
.empty .big{font-size:28px;font-weight:600;color:var(--text);margin-bottom:8px;letter-spacing:-.02em}

footer{border-top:1px solid var(--hair);margin-top:40px;padding:22px 0 48px;color:var(--text-3);font-size:12px;line-height:1.7}

/* ---------- dialog / toast ---------- */
dialog{border:none;border-radius:24px;padding:32px;width:540px;max-width:calc(100% - 32px);background:var(--surface);color:var(--text);
  box-shadow:0 30px 80px rgba(0,0,0,.3)}
dialog[open]{animation:dlg .45s var(--ease)}
dialog::backdrop{background:rgba(0,0,0,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fade .3s ease}
@keyframes dlg{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
dialog h2{margin:0 0 8px;font-size:28px;font-weight:700;letter-spacing:-.02em}
dialog label{display:block;font-weight:600;font-size:13px;margin:20px 0 6px}
dialog input,dialog select{width:100%;padding:11px 14px;border:1px solid var(--hair);border-radius:12px;background:var(--surface-2);outline:none;transition:border-color .2s,box-shadow .2s}
dialog input:focus,dialog select:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(0,113,227,.18)}
dialog .help{color:var(--text-2);font-size:12px;line-height:1.6;margin:6px 0 0}
dialog .row{display:flex;gap:10px;justify-content:flex-end;margin-top:28px}
#toast{position:fixed;bottom:32px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:50;
  background:rgba(29,29,31,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#fff;padding:12px 22px;border-radius:999px;font-size:14px;
  transition:opacity .35s var(--ease),transform .45s var(--ease)}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .card.pre{opacity:1;transform:none}
}
@media (max-width: 900px){
  .stats{grid-template-columns:repeat(2,1fr);row-gap:28px} .stat:nth-child(3){border-left:none}
  .lnav .wrap{grid-template-columns:1fr} .lnav .ttl,.lnav .totop{display:none} .lnav .seg{justify-self:center}
  .sechead .right{align-items:flex-start}
}
.tab .ls{display:none}
.lnav .seg{max-width:100%;min-width:0;overflow-x:auto;scrollbar-width:none}
.lnav .seg::-webkit-scrollbar{display:none}
.cmpwrap{overflow-x:auto}

/* ---------- phones ---------- */
@media (max-width: 640px){
  .wrap{padding:0 16px}
  .gnav .ext{display:none}
  .hero{padding:24px 0 20px}
  .stats{grid-template-columns:repeat(2,1fr);row-gap:20px}
  .stat .val{font-size:32px} .stat .val small{font-size:15px}
  .tab{padding:6px 10px;font-size:13px} .tab .lf{display:none} .tab .ls{display:inline} .tab .n{margin-left:3px}
  .lnav .wrap{height:auto;padding-top:8px;padding-bottom:8px}
  main{padding:24px 0 32px}
  .sechead{margin-bottom:18px;gap:12px} .sechead h2{font-size:28px} .sechead p{font-size:14px}
  .sechead .right{width:100%;align-items:stretch} .filters{justify-content:flex-start}
  .select select{padding:7px 26px 7px 12px}
  .grid{grid-template-columns:1fr;gap:18px}
  .body{padding:16px 18px}
  dialog.sheet,dialog.cmpdlg,dialog#settings{width:100vw;max-width:100vw;max-height:100dvh;height:100dvh;margin:0;border-radius:0}
  dialog.cmpdlg{padding:20px 16px} dialog#settings{padding:24px 20px}
  .dgrid{padding:56px 16px 0;gap:20px} .dsec{padding:20px 16px 0}
  .dinfo h2{font-size:24px} .dinfo .price .total{font-size:36px}
  .ctable{min-width:calc(150px * var(--n, 2) + 90px)} .ctable th{width:90px}
  .tray{bottom:16px;max-width:calc(100vw - 24px);gap:8px;padding:8px 8px 8px 12px} .tray .lbl{font-size:13px}
  #toast{max-width:calc(100vw - 32px);text-align:center}
  .notice{flex-wrap:wrap}
  .lnav .wrap{grid-template-columns:minmax(0,1fr)}
}
@media (max-width: 360px){ .tab{padding:6px 7px;font-size:12px} .tab .n{margin-left:2px} .stat .val{font-size:28px} }
</style>
</head>
<body>
<nav class="gnav">
  <div class="wrap">
    <span class="brand">マツダ中古車ウォッチ</span>
    <span class="sp"></span>
    <a class="ext" id="srcLink" target="_blank" rel="noopener">カーセンサーで見る ↗</a>
    <button class="iconbtn" id="settingsBtn" title="設定" aria-label="設定">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>

<dialog id="settings">
  <h2>設定</h2>
  <p class="help">星とメモはGitHubのリポジトリ内の <code>docs/data/stars.json</code> に保存されます。ブラウザのデータを消しても消えません。</p>
  <label for="repo">リポジトリ</label>
  <input id="repo" placeholder="例: yourname/car-alert">
  <label for="token">GitHub アクセストークン</label>
  <input id="token" type="password" placeholder="github_pat_...">
  <p class="help">このリポジトリだけに「Contents: Read and write」権限を与えた Fine-grained token。トークンはこのパソコンのブラウザ内にだけ保存されます。</p>
  <label for="home">自宅の都道府県</label>
  <select id="home"></select>
  <p class="help">「自宅から近い順」と距離の表示に使います。距離は県庁所在地どうしの直線距離の目安です。</p>

    <button class="btn" id="cancelSettings">閉じる</button>
    <button class="btn primary" id="saveSettings">保存</button>
  </div>

<dialog id="detail" class="sheet" aria-label="車の詳細"><div id="detailBody"></div></dialog>
<dialog id="cmpdlg" class="cmpdlg" aria-label="比較"><div id="cmpBody"></div></dialog>
<div class="tray" id="tray"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const STAR_PATH = "docs/data/stars.json";
const state = { data: null, stars: {}, starsSha: null, tab: "main", busy: new Set(), popped: null, detailId: null, photoIdx: 0,
  compare: new Set((() => { try { return JSON.parse(localStorage.getItem("compare") || "[]"); } catch { return []; } })()) };
const $ = (id) => document.getElementById(id);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

function safeGet(k){ try { return localStorage.getItem(k) || ""; } catch { return ""; } }
function safeSet(k,v){ try { localStorage.setItem(k, v); } catch {} }
function guessRepo(){
  const m = location.hostname.match(/^([^.]+)\.github\.io$/);
  const seg = location.pathname.split("/").filter(Boolean)[0];
  return m && seg ? `${m[1]}/${seg}` : "";
}
const settings = {
  get repo(){ return safeGet("repo") || guessRepo(); },
  get token(){ return safeGet("token"); },
};

function toast(msg, ms=2600){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), ms);
}
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtPrice = (v) => v == null ? "記載なし" : `${v.toFixed(1)}<small>万円</small>`;
const fmtKm = (v) => v == null ? "-" : `${Math.round(v*10000).toLocaleString()}km`;
const group = (c) => (c.model || "").startsWith("CX-30") ? "CX-30" : "MAZDA3";
// 全角英数字・全角スペースを半角にそろえる（例：Ｗｅｓｔ　Ｖｉｌｌａｇｅ → West Village）
const nz = (s) => String(s ?? "").normalize("NFKC");
const STAR_SVG = (on) => `<svg viewBox="0 0 24 24" fill="${on ? "currentColor" : "none"}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.2l2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-2.9-5.4 2.9 1.1-6-4.5-4.2 6.1-.8z"/></svg>`;

// 県庁所在地の緯度経度（自宅からの距離の目安に使う）
const PREF_POS = {
  "大阪府":[34.686,135.520], "兵庫県":[34.691,135.183], "京都府":[35.021,135.756], "滋賀県":[35.004,135.868],
  "奈良県":[34.685,135.833], "和歌山県":[34.226,135.168], "三重県":[34.730,136.509], "福井県":[36.065,136.222],
};
const homePref = () => safeGet("home") || "";
function distKm(c){
  const a = PREF_POS[homePref()], b = PREF_POS[c.pref];
  if (!a || !b) return null;
  const R = 6371, rad = Math.PI/180;
  const dLat = (b[0]-a[0])*rad, dLon = (b[1]-a[1])*rad;
  const h = Math.sin(dLat/2)**2 + Math.cos(a[0]*rad)*Math.cos(b[0]*rad)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
// このツールで初めて確認してからの日数（終了した車は終了日まで）
function daysListed(c){
  if (!c.first_seen) return null;
  const end = c.status === "ended" && c.ended_on ? c.ended_on : (state.data?.updated_at || "").slice(0,10);
  if (!end) return null;
  return Math.max(0, Math.round((new Date(end) - new Date(c.first_seen)) / 86400000));
}

// ---------- GitHub API (stars) ----------
async function gh(path, opts={}){
  const res = await fetch(`https://api.github.com/repos/${settings.repo.trim().replace(/^\/+|\/+$/g, "")}${path ? "/" + path : ""}`, {
    ...opts,
    headers: { "Accept": "application/vnd.github+json", "Authorization": `Bearer ${settings.token}`, ...(opts.headers||{}) },
  });
  return res;
}
const b64decode = (s) => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,"")), c => c.charCodeAt(0)));
const b64encode = (s) => { const b = new TextEncoder().encode(s); let bin=""; b.forEach(x => bin += String.fromCharCode(x)); return btoa(bin); };

async function loadStars(){
  if (settings.token && settings.repo){
    try {
      const res = await gh(`contents/${STAR_PATH}?ref=main&t=${Date.now()}`);
      if (res.ok){
        const j = await res.json();
        state.starsSha = j.sha;
        state.stars = JSON.parse(b64decode(j.content) || "{}");
        safeSet("starsCache", JSON.stringify(state.stars));
        return;
      }
      if (res.status === 404){ state.starsSha = null; state.stars = {}; return; }
      toast(`星の読み込みに失敗しました（${res.status}）。設定を確認してください`, 5000);
    } catch(e){ toast("星の読み込みに失敗しました（通信エラー）", 5000); }
  }
  // トークン未設定時は公開ファイル（数分遅れ）かキャッシュを表示
  try {
    const r = await fetch(`data/stars.json?t=${Date.now()}`);
    if (r.ok){ state.stars = await r.json(); return; }
  } catch {}
  try { state.stars = JSON.parse(safeGet("starsCache") || "{}"); } catch { state.stars = {}; }
}

async function saveStars(message, mutate){
  // 競合（409/422）が起きたら最新を読み直して再適用する
  for (let attempt = 0; attempt < 3; attempt++){
    mutate(state.stars);
    const body = { message, content: b64encode(JSON.stringify(state.stars, null, 1) + "\n"), branch: "main" };
    if (state.starsSha) body.sha = state.starsSha;
    const res = await gh(`contents/${STAR_PATH}`, { method: "PUT", body: JSON.stringify(body) });
    if (res.ok){
      state.starsSha = (await res.json()).content.sha;
      safeSet("starsCache", JSON.stringify(state.stars));
      return true;
    }
    if (res.status === 409 || res.status === 422){ await loadStars(); continue; }
    throw new Error(`保存に失敗しました（${res.status}）`);
  }
  throw new Error("保存に失敗しました（競合が続いています）");
}

async function toggleStar(id){
  if (!settings.token || !settings.repo){ toast("星を保存するには、まず設定でトークンを登録してください", 4000); openSettings(); return; }
  if (state.busy.has(id)) return;
  state.busy.add(id); render();
  const car = state.data.cars[id];
  const on = !state.stars[id];
  try {
    await saveStars(`${on ? "★" : "☆"} ${car?.model || id}`, (s) => {
      if (on) s[id] = { starred_at: new Date().toISOString(), snapshot: car ? snapshot(car) : (s[id]?.snapshot || null) };
      else delete s[id];
    });
    if (on) state.popped = id;
    toast(on ? "保存しました" : "保存を解除しました");
  } catch(e){ toast(e.message, 5000); await loadStars(); }
  state.busy.delete(id); render();
}
function snapshot(c){
  const keys = ["id","model","grade","catch","total_price","base_price","year","mileage","color","pref","city","shop","image","photos","url","body","mission","repair","inspection","warranty","displacement","first_seen","price_history","detail"];
  return Object.fromEntries(keys.map(k => [k, c[k]]));
}

// ---------- data helpers ----------
function allCars(){
  const cars = { ...(state.data?.cars || {}) };
  // 星つきでデータから消えた車はスナップショットで表示（掲載終了扱い）
  for (const [id, s] of Object.entries(state.stars)){
    if (!cars[id] && s?.snapshot) cars[id] = { ...s.snapshot, status: "ended", tier: "other", price_history: [] };
  }
  return Object.values(cars);
}
function lastDrop(c){
  const h = (c.price_history || []).filter(x => (x.total ?? x.base) != null);
  if (h.length < 2) return null;
  const a = h[h.length-2], b = h[h.length-1];
  const pa = a.total ?? a.base, pb = b.total ?? b.base;
  return pb < pa ? { amount: pa - pb, date: b.date } : null;
}
const updDate = () => (state.data?.updated_at || "").slice(0,10);
const isNew = (c) => c.first_seen && c.first_seen === updDate();

function tabsDef(){
  const k = state.data?.conditions || {};
  return [
    ["main","本命", c => c.status === "active" && c.tier === "main", "すべての条件を満たす車。", "本命"],
    ["near","惜しい候補", c => c.status === "active" && c.tier === "near",
      `支払総額${k.near_total_price_max ?? 220}万円・${k.near_mileage_max ?? 6}万kmまで広げると見つかる車。`, "惜しい"],
    ["star","保存", c => !!state.stars[c.id], "★をつけた車と、そのメモ。", "保存"],
    ["all","すべて", c => c.status !== "ended", "全方位カメラ付き・修復歴なしのガソリン車すべて。", "すべて"],
    ["ended","掲載終了", c => c.status === "ended", "売れた、または掲載が終わった車。", "終了"],
  ];
}

// ---------- render ----------
function render(animate = false){
  const cars = allCars();
  const model = $("model").value, pref = $("pref").value;
  const match = (c) => (!model || group(c) === model) && (!pref || c.pref === pref);
  const TABS = tabsDef();
  $("tabs").innerHTML = TABS.map(([k,label,f,,short]) => {
    const n = cars.filter(c => f(c) && match(c)).length;
    return `<button class="tab ${state.tab===k?"on":""}" data-tab="${k}" role="tab" aria-selected="${state.tab===k}"><span class="lf">${label}</span><span class="ls">${short}</span><span class="n">${n}</span></button>`;
  }).join("");
  moveIndicator(animate);

  const [, title, filt, desc] = TABS.find(t => t[0] === state.tab);
  let list = cars.filter(c => filt(c) && match(c));
  const sort = $("sort").value;
  const P = (c) => c.total_price ?? c.base_price ?? 9999;
  list.sort({
    price: (a,b) => P(a) - P(b),
    new: (a,b) => (b.first_seen||"").localeCompare(a.first_seen||"") || P(a) - P(b),
    km: (a,b) => (a.mileage??99) - (b.mileage??99),
    year: (a,b) => (b.year||0) - (a.year||0) || P(a) - P(b),
    dist: (a,b) => (distKm(a) ?? 9999) - (distKm(b) ?? 9999) || P(a) - P(b),
    days: (a,b) => (daysListed(b) ?? -1) - (daysListed(a) ?? -1) || P(a) - P(b),
  }[sort]);

  $("secTitle").textContent = title;
  $("secDesc").textContent = desc;
  $("secCount").textContent = `${list.length}台`;
  $("grid").innerHTML = list.length ? list.map(c => card(c, animate)).join("") :
    emptyHtml(model || pref);
  if (animate) reveal();
  renderDetail(); renderCompare(); renderTray();
  state.popped = null;
}

function emptyHtml(filtered){
  const [big, small] = filtered ? ["該当する車はありません。", "車種や地域の絞り込みを「すべて」に戻してみてください。"] : ({
    main: ["今は本命の車がありません。", "新しく見つかったら、21時のメールでお知らせします。"],
    near: ["今は惜しい候補がありません。", "新しく見つかったら、21時のメールでお知らせします。"],
    star: ["まだ保存した車はありません。", "気になる車の ☆ を押すと、ここに集まります。"],
    all: ["今は掲載中の車がありません。", "取得に失敗している可能性があります。21時のメールを確認してください。"],
    ended: ["まだ掲載終了になった車はありません。", "売れた車は、ここに自動で移ります。"],
  })[state.tab];
  return `<div class="empty"><div class="big">${big}</div>${small}</div>`;
}

// セグメントの白いつまみを、選択中のタブまでスライドさせる
function moveIndicator(animate){
  const on = document.querySelector(".tab.on"), ind = $("ind");
  if (!on) return;
  if (!animate && !ind.dataset.ready) ind.style.transition = "none";
  ind.style.width = on.offsetWidth + "px";
  ind.style.transform = `translateX(${on.offsetLeft}px)`;
  if (!ind.dataset.ready){ ind.offsetWidth; ind.style.transition = ""; ind.dataset.ready = "1"; }
}

// 画面に入ってきたカードから順に、ふわっと浮かび上がらせる
let revealObs;
function reveal(){
  if (reduceMotion || !("IntersectionObserver" in window)){
    document.querySelectorAll(".card.pre").forEach(c => c.classList.remove("pre")); return;
  }
  revealObs?.disconnect();
  revealObs = new IntersectionObserver((entries) => {
    entries.filter(e => e.isIntersecting).forEach((e, i) => {
      e.target.style.transitionDelay = `${Math.min(i, 8) * 60}ms`;
      e.target.classList.remove("pre");
      setTimeout(() => { e.target.style.transitionDelay = ""; }, 900);
      revealObs.unobserve(e.target);
    });
  }, { rootMargin: "0px 0px -40px 0px" });
  document.querySelectorAll(".card.pre").forEach(c => revealObs.observe(c));
}

function card(c, animate){
  const starred = !!state.stars[c.id];
  const drop = lastDrop(c);
  const badges = [];
  if (c.status === "ended") badges.push(`<span class="badge b-ended">掲載終了</span>`);
  else if (c.status === "out_of_search") badges.push(`<span class="badge b-oos">条件外に変更</span>`);
  if (c.status !== "ended"){
    if (c.tier === "main") badges.push(`<span class="badge b-main">本命</span>`);
    if (c.tier === "near") badges.push(`<span class="badge b-near">惜しい</span>`);
    if (isNew(c)) badges.push(`<span class="badge b-new">NEW</span>`);
    if (drop) badges.push(`<span class="badge b-drop">値下げ</span>`);
  }
  const chips = [];

// ---------- price chart ----------
// 価格は変わるまで同じ値が続くので、階段状の線で描く。掲載中なら最終更新日まで線を伸ばす
function priceSeries(c){
  const pts = (c.price_history || []).map(h => ({ d: h.date, v: h.total ?? h.base })).filter(p => p.v != null);
  return pts;
}
function chartSVG(c, { w = 150, h = 30, axes = false } = {}){
  const pts = priceSeries(c);
  if (!pts.length) return "";
  const end = c.status === "ended" ? (c.ended_on || pts[pts.length-1].d) : (updDate() || pts[pts.length-1].d);
  const series = [...pts]; if (end > pts[pts.length-1].d) series.push({ d: end, v: pts[pts.length-1].v, tail: true });
  const t = (d) => new Date(d).getTime();
  const x0 = t(series[0].d), x1 = Math.max(t(series[series.length-1].d), x0 + 86400000);
  let lo = Math.min(...series.map(p => p.v)), hi = Math.max(...series.map(p => p.v));
  const pad = Math.max((hi - lo) * 0.25, 2); lo -= pad; hi += pad;
  const L = axes ? 56 : 2, R = axes ? 16 : 2, T = axes ? 14 : 3, B = axes ? 28 : 3;
  const X = (d) => L + (t(d) - x0) / (x1 - x0) * (w - L - R);
  const Y = (v) => T + (hi - v) / (hi - lo) * (h - T - B);
  let path = `M${X(series[0].d)},${Y(series[0].v)}`;
  for (let i = 1; i < series.length; i++) path += ` H${X(series[i].d)} V${Y(series[i].v)}`;
  const down = pts[pts.length-1].v < pts[0].v, up = pts[pts.length-1].v > pts[0].v;
  const col = down ? "var(--drop)" : up ? "var(--near)" : "var(--text-2)";
  const dots = pts.map((p, i) => `<circle cx="${X(p.d)}" cy="${Y(p.v)}" r="${axes ? (i === pts.length-1 ? 5 : 3.5) : (i === pts.length-1 ? 2.6 : 0)}" fill="${i === pts.length-1 ? col : "var(--surface)"}" stroke="${col}" stroke-width="${axes ? 2 : 0}"/>`).join("");
  let extra = "";
  if (axes){
    const ticks = [hi - pad, lo + pad].filter((v, i, a) => a.indexOf(v) === i);
    extra += ticks.map(v => `<line x1="${L}" x2="${w-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--hair)"/><text x="${L-10}" y="${Y(v)+4}" text-anchor="end" font-size="12" fill="var(--text-3)">${v.toFixed(1)}</text>`).join("");
    const fmt = (d) => d.slice(5).replace("-", "/");
    extra += `<text x="${L}" y="${h-6}" font-size="12" fill="var(--text-3)">${fmt(series[0].d)}</text><text x="${w-R}" y="${h-6}" text-anchor="end" font-size="12" fill="var(--text-3)">${fmt(series[series.length-1].d)}</text>`;
    extra += pts.map((p, i) => i === 0 || p.v === pts[i-1].v ? "" : `<text x="${X(p.d)+8}" y="${Y(p.v)-9}" font-size="12" font-weight="600" fill="${p.v < pts[i-1].v ? "var(--drop)" : "var(--near)"}">${p.v < pts[i-1].v ? "▼" : "▲"}${Math.abs(p.v - pts[i-1].v).toFixed(1)}</text>`).join("");
  }
  return `<svg viewBox="0 0 ${w} ${h}" ${axes ? "" : `width="${w}" height="${h}"`} role="img" aria-label="価格の推移">${extra}<path d="${path}" fill="none" stroke="${col}" stroke-width="${axes ? 2.5 : 1.8}" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>`;
}

      ${row("法定整備", c => `<td>${esc(spec(c, "法定整備") || "-")}</td>`)}
      ${grp("仕様")}
      ${row("色", c => `<td>${esc(spec(c, "色") || nz(c.color) || "-")}</td>`)}
      ${row("ミッション", c => `<td>${esc(nz(c.mission) || "-")}</td>`)}
      ${row("駆動方式", c => `<td>${esc(spec(c, "駆動方式") || "-")}</td>`)}
      ${row("燃費(WLTC)", (c, i) => cell(fuels[i], bE, esc(spec(c, "WLTC燃費") || "-")))}
      ${grp("装備")}
      ${EQUIP.map(([label, key]) => row(label, (c, i) => !c.detail ? `<td class="no">未取得</td>` : eq[i].has(key) ? `<td class="yes">◯</td>` : `<td class="no">−</td>`)).join("")}
      ${grp("場所・その他")}
      ${row("所在地", c => `<td>${esc(c.pref)}${esc(nz(c.city))}<br><span style="color:var(--text-2);font-size:12px">${esc(nz(c.shop))}</span></td>`)}
      ${row("自宅から", (c, i) => cell(dist[i], bD, esc(distLabel(c))))}
      ${row("掲載確認から", (c, i) => `<td>${days[i] == null ? "-" : days[i] + "日"}</td>`)}
      ${row("状態", c => `<td>${c.status === "ended" ? "掲載終了" : c.tier === "main" ? "本命" : c.tier === "near" ? "惜しい候補" : "掲載中"}</td>`)}
      ${row("メモ", c => `<td style="white-space:pre-wrap">${esc(state.stars[c.id]?.memo || "-")}</td>`)}
    </table></div>
    <p style="color:var(--text-3);font-size:12px;margin-top:16px">◎ は比べた中で一番良い値（支払総額・諸費用・走行距離・自宅からの距離は小さい方、年式は新しい方、燃費は良い方）。◯ はその装備・条件あり、− はなし。</p>`;
}

// ---------- memo ----------
const editing = new Set();
function memoHtml(id){
  const memo = state.stars[id]?.memo || "";
  if (editing.has(id)) return `<div class="memo" data-memo-box="${esc(id)}">
    <textarea data-memo-input="${esc(id)}" placeholder="例：試乗予約 12/1 10時、タイヤの溝を確認">${esc(memo)}</textarea>
    <div class="mrow"><button class="btn sm" data-memo-cancel="${esc(id)}">キャンセル</button><button class="btn sm primary" data-memo-save="${esc(id)}" ${state.busy.has(id)?"disabled":""}>保存</button></div></div>`;
  return memo ? `<div class="memo" data-memo-edit="${esc(id)}" title="クリックして編集">${esc(memo)}</div>`
              : `<div class="memo emptymemo" data-memo-edit="${esc(id)}">＋ メモを追加</div>`;
}
async function saveMemo(id, btn){
  const text = (btn?.closest(".memo")?.querySelector("textarea")?.value || "").trim();
  state.busy.add(id); render();
  try {
    await saveStars(`📝 ${state.data.cars[id]?.model || id}`, (s) => { if (s[id]) { if (text) s[id].memo = text; else delete s[id].memo; } });
    editing.delete(id); toast("メモを保存しました");
  } catch(e){ toast(e.message, 5000); }
  state.busy.delete(id); render();
}

// ---------- header ----------
function countUp(el, to, decimals){
  if (reduceMotion || to == null){ el.textContent = to == null ? "-" : to.toFixed(decimals); return; }
  const start = performance.now(), dur = 1100;
  const step = (t) => {
    const p = Math.min(1, (t - start) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = (to * e).toFixed(decimals);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function renderHeader(){
  const d = state.data;
  const k = d?.conditions;
  const active = Object.values(d?.cars || {}).filter(c => c.status === "active");
  const mains = active.filter(c => c.tier === "main");
  const minMain = mains.reduce((m,c) => c.total_price != null && (m == null || c.total_price < m) ? c.total_price : m, null);
  const newToday = active.filter(c => (c.tier === "main" || c.tier === "near") && isNew(c)).length;
  const drops = active.filter(c => (c.tier === "main" || c.tier === "near") && lastDrop(c)?.date === updDate()).length;
  const stats = [
    ["本命", mains.length, 0, "台", "good"],
    ["本命の最安", minMain, 1, "万円", ""],
    ["今日の新着", newToday, 0, "台", ""],
    ["今日の値下げ", drops, 0, "台", drops ? "red" : ""],
  ];
  $("stats").innerHTML = stats.map(([l,,,u,cls], i) => `<div class="stat ${cls}"><div class="lbl">${l}</div><div class="val"><span data-stat="${i}">-</span><small>${u}</small></div></div>`).join("");
  stats.forEach(([, v, dec], i) => countUp(document.querySelector(`[data-stat="${i}"]`), v, dec));

  $("updated").textContent = d?.updated_at ? `最終更新 ${d.updated_at.replace("T"," ").slice(0,16)}` : "";
  $("srcLink").href = d?.search_url || "https://www.carsensor.net/";
  const prefs = k?.prefs || Object.keys(PREF_POS);
  const cur = $("pref").value;
  $("pref").innerHTML = `<option value="">全地域</option>` + prefs.map(p => `<option ${p===cur?"selected":""}>${esc(p)}</option>`).join("");
  if (k) $("cond").textContent = `本命：${k.year_min}年以降・修復歴なし・全方位カメラ・ガソリン車（e-SKYACTIV X含む）・支払総額${k.main_total_price_max}万円以内・${k.main_mileage_max}万km以内。惜しい候補：支払総額${k.near_total_price_max}万円以内・${k.near_mileage_max}万km以内。地域：${k.prefs.join("・")}。情報元：カーセンサー。掲載内容は必ず販売店でご確認ください。`;
  $("warn").innerHTML = (!settings.token && !safeGet("hideNotice")) ? `<div class="notice">★で車を保存するには、このブラウザにGitHubのトークンを登録してください。<button class="btn sm primary" data-open-settings>設定を開く</button><button class="x" data-dismiss-notice title="閉じる" aria-label="閉じる">×</button></div>` : "";
}

// ---------- events ----------
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-tab]"); if (t){ if (state.tab !== t.dataset.tab){ state.tab = t.dataset.tab; scrollToList(); render(true); } return; }
  const s = e.target.closest("[data-star]"); if (s){ e.preventDefault(); toggleStar(s.dataset.star); return; }
  const me = e.target.closest("[data-memo-edit]"); if (me){ editing.add(me.dataset.memoEdit); render();
    const scope = $("detail").open ? $("detail") : document;
    scope.querySelector(`[data-memo-input="${CSS.escape(me.dataset.memoEdit)}"]`)?.focus(); return; }
  const mc = e.target.closest("[data-memo-cancel]"); if (mc){ editing.delete(mc.dataset.memoCancel); render(); return; }
  const ms = e.target.closest("[data-memo-save]"); if (ms){ saveMemo(ms.dataset.memoSave, ms); return; }
  const dt = e.target.closest("[data-detail]");
  if (dt && !(e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1)){ e.preventDefault(); openDetail(dt.dataset.detail); return; }
  const ph = e.target.closest("[data-photo]"); if (ph){ state.photoIdx = +ph.dataset.photo; renderDetail(); return; }
  const cm = e.target.closest("[data-cmp]"); if (cm){ toggleCompare(cm.dataset.cmp); return; }
  if (e.target.closest("[data-cmp-open]")){ $("cmpdlg").showModal(); renderCompare(); return; }
  if (e.target.closest("[data-cmp-clear]")){ state.compare.clear(); saveCompare(); $("cmpdlg").close(); render(); return; }
  if (e.target.closest("[data-close]")){ e.target.closest("dialog")?.close(); return; }
  if (e.target.closest("[data-dismiss-notice]")){ safeSet("hideNotice", "1"); $("warn").innerHTML = ""; return; }
  if (e.target.closest("[data-open-settings]")) openSettings();
});
function scrollToList(){
  // 見出し（本命・保存など）が固定バーの下に隠れない位置まで戻す
  const top = $("list-top").getBoundingClientRect().top + window.scrollY - $("lnav").offsetHeight - 28;
  if (window.scrollY > top) window.scrollTo({ top, behavior: reduceMotion ? "auto" : "smooth" });
}
$("model").onchange = () => { scrollToList(); render(true); };
$("pref").onchange = () => { scrollToList(); render(true); };
$("sort").onchange = () => { safeSet("sort", $("sort").value); render(true); };
function openSettings(){
  $("repo").value = settings.repo; $("token").value = settings.token;
  $("home").innerHTML = `<option value="">未設定</option>` + Object.keys(PREF_POS).map(p => `<option ${p===homePref()?"selected":""}>${p}</option>`).join("");
  $("settings").showModal();
}
$("settingsBtn").onclick = openSettings;
$("cancelSettings").onclick = () => $("settings").close();
$("saveSettings").onclick = async () => {
  safeSet("repo", $("repo").value.trim()); safeSet("token", $("token").value.trim()); safeSet("home", $("home").value);
  if (!settings.token){ $("settings").close(); toast("保存しました"); renderHeader(); render(); return; }
  try {
    const res = await gh("");
    if (!res.ok) throw new Error(res.status);
    const j = await res.json();
    if (!j.permissions?.push) throw new Error("書き込み権限がありません");
    toast("保存しました（GitHubに接続できました）"); $("settings").close();
  } catch(err){ toast(`接続できませんでした（${err.message}）。リポジトリ名とトークンを確認してください`, 6000); return; }
  await loadStars(); renderHeader(); render();
};
window.addEventListener("resize", () => moveIndicator(false));
for (const dlg of document.querySelectorAll("dialog")) dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });
$("detail").addEventListener("close", () => { state.detailId = null; });
document.addEventListener("keydown", (e) => {
  if (!$("detail").open || e.target.closest("textarea,input")) return;
  const n = photosOf(findCar(state.detailId) || {}).length; if (n < 2) return;
  if (e.key === "ArrowRight"){ state.photoIdx = (state.photoIdx + 1) % n; renderDetail(); }
  if (e.key === "ArrowLeft"){ state.photoIdx = (state.photoIdx - 1 + n) % n; renderDetail(); }
});
$("totop").onclick = () => window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
// フォントの読み込みなどでタブの幅が変わったら、つまみの位置を合わせ直す
if ("ResizeObserver" in window) new ResizeObserver(() => moveIndicator(false)).observe($("tabs"));

// ヒーローが画面から消えたら、上部バーに区切り線とタイトルを出す
new IntersectionObserver(([e]) => $("lnav").classList.toggle("stuck", !e.isIntersecting), { rootMargin: "-1px 0px 0px 0px" })
  .observe($("hero"));

(async function init(){
  const s = safeGet("sort"); if (s) $("sort").value = s;
  try {
    const r = await fetch(`data/listings.json?t=${Date.now()}`);
    state.data = r.ok ? await r.json() : { cars: {} };
  } catch { state.data = { cars: {} }; }
  await loadStars();
  renderHeader(); render(true);
})();
</script>
